databases:
  - name: school-eat-db
    plan: free

services:
  - type: web
    name: school-eat-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-eat-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEV1_PHONE
        sync: false
      - key: DEV1_NAME
        sync: false
      - key: DEV2_PHONE
        sync: false
      - key: DEV2_NAME
        sync: false
