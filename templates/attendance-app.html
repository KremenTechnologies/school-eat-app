<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Журнал відвідування та заявки на харчування</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7F2;
    --surface:#FFFFFF;
    --ink:#1F2A37;
    --ink-soft:#5B6472;
    --navy:#1E3A5F;
    --navy-deep:#152A45;
    --teal:#3F7566;
    --teal-soft:#E7F0EC;
    --rust:#A8442E;
    --rust-soft:#F5E7E2;
    --line:#DCD5C6;
    --line-soft:#EAE5D9;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3,h4{font-family:'IBM Plex Serif', Georgia, serif; margin:0; color:var(--navy-deep);}
  .app-shell{max-width:1080px; margin:0 auto; padding:28px 20px 80px;}
  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:2px solid var(--navy); padding-bottom:16px; margin-bottom:16px;
    flex-wrap:wrap; gap:8px;
  }
  header.top h1{font-size:22px; letter-spacing:.2px;}
  header.top p{margin:4px 0 0; color:var(--ink-soft); font-size:13.5px;}
  .user-bar{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
    background:var(--teal-soft); border:1px solid var(--line); border-radius:4px;
    padding:8px 14px; margin-bottom:18px; font-size:13.5px;
  }
  .user-bar .who strong{color:var(--navy-deep);}
  .user-bar button{background:transparent; border:1px solid var(--navy); color:var(--navy); border-radius:4px; padding:5px 12px; font-size:13px; font-weight:600; cursor:pointer;}
  .user-bar button:hover{background:#fff;}
  .role-tag{display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:10px; background:var(--navy); color:#fff; margin-left:8px; vertical-align:middle;}
  .role-tag.admin{background:var(--teal);}
  .role-tag.teacher{background:var(--ink-soft);}
  nav.tabs{display:flex; gap:6px; margin-bottom:24px; flex-wrap:wrap;}
  nav.tabs button{
    font-family:inherit; font-size:14px; font-weight:600; color:var(--ink-soft);
    background:transparent; border:1px solid transparent; border-bottom:2px solid transparent;
    padding:9px 14px; cursor:pointer; border-radius:4px 4px 0 0;
  }
  nav.tabs button.active{color:var(--navy-deep); border-bottom:2px solid var(--navy);}
  nav.tabs button:hover:not(.active){background:var(--line-soft);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:18px;}
  .card h2{font-size:17px; margin-bottom:4px;}
  .card h3{font-size:14px; margin:18px 0 4px;}
  .card .hint{color:var(--ink-soft); font-size:13px; margin-bottom:16px;}
  .field-row{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
  .field{display:flex; flex-direction:column; gap:5px; flex:1; min-width:150px;}
  .field.narrow{flex:0 0 130px; min-width:110px;}
  .field label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .field input[type=text], .field input[type=number], .field input[type=date], .field input[type=tel],
  .field input[type=password], .field select, .field textarea{
    font-family:inherit; font-size:14.5px; padding:8px 10px; border:1px solid var(--line);
    border-radius:4px; background:var(--paper); color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--navy); outline-offset:1px;}
  .field textarea{resize:vertical; min-height:44px;}
  .field .computed{ font-size:20px; font-weight:700; color:var(--navy-deep); padding:7px 2px; }
  .field .computed small{display:block; font-size:11px; font-weight:500; color:var(--ink-soft);}
  .field .static-value{font-size:15px; font-weight:700; color:var(--navy-deep); padding:8px 0;}
  .absence-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:14px;}
  @media (max-width:640px){ .absence-grid{grid-template-columns:1fr;} }
  .absence-box{border:1px solid var(--line-soft); border-radius:4px; padding:12px; background:var(--paper);}
  .absence-box .absence-title{font-size:12.5px; font-weight:700; color:var(--rust); margin-bottom:8px;}
  .btn{
    font-family:inherit; font-weight:600; font-size:14px; cursor:pointer; border-radius:4px;
    padding:10px 18px; border:1px solid var(--navy); background:var(--navy); color:#fff;
  }
  .btn:hover{background:var(--navy-deep);}
  .btn.secondary{background:transparent; color:var(--navy); border:1px solid var(--navy);}
  .btn.secondary:hover{background:var(--teal-soft);}
  .btn.danger{background:transparent; color:var(--rust); border:1px solid var(--rust);}
  .btn.danger:hover{background:var(--rust-soft);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  table.data{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.data th, table.data td{border:1px solid var(--line); padding:7px 8px; text-align:left;}
  table.data th{background:var(--teal-soft); color:var(--navy-deep); font-weight:600; font-size:12.5px;}
  table.data tr:nth-child(even) td{background:#FCFBF8;}
  table.data td.num{text-align:center;}
  table.data tr.totals-row td{font-weight:700; background:var(--teal-soft) !important;}
  .notice{
    font-size:12.5px; color:var(--ink-soft); background:var(--line-soft); border-radius:4px;
    padding:8px 12px; margin-bottom:18px; border:1px solid var(--line);
  }
  .empty{color:var(--ink-soft); font-style:italic; padding:20px 0; text-align:center;}
  .status-msg{font-size:13px; margin-top:8px; min-height:18px;}
  .status-msg.ok{color:var(--teal);}
  .status-msg.err{color:var(--rust);}
  .classes-list{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;}
  .chip{
    display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line);
    border-radius:20px; padding:6px 8px 6px 14px; font-size:13.5px; font-weight:600;
  }
  .chip button{
    background:var(--rust-soft); color:var(--rust); border:none; border-radius:50%;
    width:20px; height:20px; line-height:18px; cursor:pointer; font-size:13px;
  }
  .history-list{display:flex; flex-direction:column; gap:6px;}
  .history-item{
    display:flex; justify-content:space-between; align-items:center; padding:10px 14px;
    border:1px solid var(--line); border-radius:4px; background:var(--paper); cursor:pointer;
  }
  .history-item:hover{border-color:var(--navy);}
  .history-item .cnt{color:var(--ink-soft); font-size:12.5px;}
  /* Report */
  .report-block{border:1px solid var(--line-soft); border-radius:4px; padding:12px 14px; margin-bottom:10px; background:var(--paper);}
  .report-block h4{font-size:13.5px; margin:0 0 8px;}
  .absentee-line{font-size:13px; margin:4px 0; color:var(--ink);}
  .absentee-line b{color:var(--rust); font-weight:600;}
  .absentee-line i{color:var(--ink-soft);}
  /* Meal slips */
  .slip-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .slip-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;}
  @media (max-width:760px){ .slip-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:480px){ .slip-grid{grid-template-columns:1fr;} }
  .slip{ border:1.5px solid var(--navy); border-radius:4px; padding:12px 14px; background:var(--surface); }
  .slip h3{font-size:13px; font-family:'IBM Plex Serif',serif; border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:8px;}
  .slip .row{display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:6px;}
  .slip .row label{color:var(--ink-soft);}
  .slip .row input[type=number]{width:56px; padding:3px 5px; font-size:13px; border:1px solid var(--line); border-radius:3px;}
  .slip .row input[type=text]{width:120px; padding:3px 5px; font-size:12.5px; border:1px solid var(--line); border-radius:3px;}
  .slip .rule-note{font-size:11px; color:var(--ink-soft); margin-top:2px; font-style:italic;}
  /* Login */
  .login-wrap{max-width:420px; margin:60px auto;}
  .login-wrap .card{padding:28px;}
  .login-wrap h2{margin-bottom:6px;}
  .login-wrap .switch-link{font-size:13px; text-align:center; margin-top:14px;}
  .login-wrap .switch-link a{color:var(--navy); cursor:pointer; text-decoration:underline;}
  /* Users table (settings) */
  .user-row{display:grid; grid-template-columns:1fr 1fr 130px 110px 34px; gap:8px; align-items:center; margin-bottom:8px;}
  .user-row.admin-row{grid-template-columns:1fr 1fr 34px;}
  @media (max-width:760px){ .user-row, .user-row.admin-row{grid-template-columns:1fr; } }
  .user-row input, .user-row select{font-family:inherit; font-size:13.5px; padding:7px 8px; border:1px solid var(--line); border-radius:4px; background:var(--paper);}
  @media print{
    body{background:#fff;}
    header.top, nav.tabs, .user-bar, .no-print, .card > .hint, .slip-toolbar .btn, .field, .not-print-area{display:none !important;}
    .app-shell{max-width:none; padding:0;}
    #view > *:not(#print-area){display:none !important;}
    #print-area{display:block !important;}
    .slip{break-inside:avoid; border:1.3px solid #000;}
    .slip .row input{border:none; font-weight:600;}
    .print-title{display:block !important; text-align:center; font-family:'IBM Plex Serif',serif; font-size:16px; margin-bottom:10px;}
  }
  .print-title{display:none;}
</style>
</head>
<body>
<div class="app-shell">
  <header class="top">
    <div>
      <h1>Журнал відвідування</h1>
      <p>Заявки на харчування формуються автоматично з даних відвідування</p>
    </div>
  </header>
  <div id="user-bar-holder"></div>
  <nav class="tabs no-print" id="tabs"></nav>
  <main id="view"><div class="empty">Завантаження…</div></main>
</div>
<script>
(function(){
  "use strict";

  async function api(method, path, body){
    const opt = {method, headers:{}, credentials:"same-origin"};
    if(body !== undefined){ opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
    const resp = await fetch("/api" + path, opt);
    let data = null;
    try{ data = await resp.json(); }catch(e){}
    if(!resp.ok){
      const err = new Error((data && data.detail) || ("HTTP " + resp.status));
      err.status = resp.status;
      throw err;
    }
    return data;
  }

  // Grades that receive only breakfast, and grades that receive only lunch.
  const BREAKFAST_ONLY_GRADES = [1,2,3,4,5,6,9];
  const LUNCH_ONLY_GRADES = [7,8];

  const ABSENCE_KEYS = [
    {key:"illness", label:"По хворобі"},
    {key:"grvi", label:"По ГРВІ"},
    {key:"family", label:"По сімейних причинах"},
    {key:"no_reason", label:"Без поважної причини"}
  ];
  const cnt = k => k + "_count";
  const nms = k => k + "_names";

  const state = {
    tab: "attendance",
    date: todayStr(),
    classes: [],
    users: [],
    settings: {botToken:"", chatId:""},
    session: null,
    dateCache: {},
    dateCacheDate: null,
    historyDates: null,
    selectedClass: null,
    reportMonth: monthPrefixDefault(),
    loginMode: "name" // "name" | "sms"
  };

  function monthPrefixDefault(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }

  function todayStr(){
    const d = new Date();
    const p = n => String(n).padStart(2,"0");
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
  }
  function fmtDate(iso){ const [y,m,d] = iso.split("-"); return `${d}.${m}.${y}`; }
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function normPhone(p){ return String(p||"").replace(/\D/g,""); }
  function num(v){ const n = parseInt(v,10); return isNaN(n) ? 0 : n; }
  function cssSafe(s){ return s.replace(/[^a-zA-Z0-9\u0430-\u044f\u0410-\u042f\u0456\u0406\u0457\u0407\u0454\u0404]/g, "_"); }
  function parseGrade(cls){ const m = String(cls||"").match(/(\d{1,2})/); return m ? parseInt(m[1],10) : null; }
  function mealDefaults(cls, present){
    const grade = parseGrade(cls);
    if(grade !== null && BREAKFAST_ONLY_GRADES.includes(grade)) return {breakfast:present, lunch:0};
    if(grade !== null && LUNCH_ONLY_GRADES.includes(grade)) return {breakfast:0, lunch:present};
    return {breakfast:present, lunch:present};
  }
  function mealRuleNote(cls){
    const grade = parseGrade(cls);
    if(grade !== null && BREAKFAST_ONLY_GRADES.includes(grade)) return "За правилами цей клас отримує лише сніданок";
    if(grade !== null && LUNCH_ONLY_GRADES.includes(grade)) return "За правилами цей клас отримує лише обід";
    return "";
  }

  // ---------- roles / permissions ----------
  function role(){ return state.session ? state.session.role : null; }
  function isDev(){ return role() === "developer"; }
  function isPriv(){ return role() === "developer" || role() === "admin"; }
  function isTeacher(){ return role() === "teacher"; }
  function roleLabel(r){
    if(r === "developer") return "розробник";
    if(r === "admin") return "адміністратор";
    return "класний керівник";
  }
  function roleTagClass(r){
    if(r === "developer") return "";
    if(r === "admin") return "admin";
    return "teacher";
  }

  // ---------- data layer (REST) ----------
  async function loadClasses(){
    try{ state.classes = await api("GET", "/classes"); }catch(e){ state.classes = []; }
  }
  async function addClasses(names){
    state.classes = await api("POST", "/classes", names.map(n => ({name:n})));
  }
  async function deleteClass(name){
    await api("DELETE", "/classes/" + encodeURIComponent(name));
    await loadClasses();
  }
  async function loadUsers(){
    try{ state.users = await api("GET", "/users"); }catch(e){ state.users = []; }
  }
  async function addUser(u){ await api("POST", "/users", u); await loadUsers(); }
  async function patchUser(id, patch){ await api("PATCH", "/users/" + id, patch); await loadUsers(); }
  async function deleteUser(id){ await api("DELETE", "/users/" + id); await loadUsers(); }
  async function loadSettings(){
    try{ state.settings = await api("GET", "/settings"); }
    catch(e){ state.settings = {botToken:"", chatId:""}; }
  }
  async function saveSettings(s){
    await api("PUT", "/settings", s);
    state.settings = s;
  }
  async function loadSession(){
    try{ state.session = await api("GET", "/me"); }catch(e){ state.session = null; }
  }
  async function clearSession(){
    try{ await api("POST", "/logout"); }catch(e){}
    state.session = null;
  }
  async function setAttendance(date, cls, record){
    return api("PUT", `/attendance/${date}/${encodeURIComponent(cls)}`, record);
  }
  async function deleteAttendance(date, cls){
    await api("DELETE", `/attendance/${date}/${encodeURIComponent(cls)}`);
  }
  async function sendSummary(date){
    return api("POST", "/attendance/summary?date=" + date);
  }
  async function loadDateRecords(date){
    if(state.dateCacheDate === date && state.dateCache) return state.dateCache;
    const out = {};
    try{
      const rows = await api("GET", "/attendance?date=" + date);
      rows.forEach(r => { out[r.class_name] = r; });
    }catch(e){}
    state.dateCache = out; state.dateCacheDate = date;
    return out;
  }
  function invalidateDateCache(date){ if(state.dateCacheDate === date){ state.dateCacheDate = null; state.dateCache = {}; } state.historyDates = null; }
  async function loadAllDates(){
    if(state.historyDates) return state.historyDates;
    const counts = {};
    try{
      const rows = await api("GET", "/attendance");
      rows.forEach(r => { counts[r.date] = (counts[r.date] || 0) + 1; });
    }catch(e){}
    state.historyDates = Object.keys(counts).sort().reverse().map(d => ({date:d, count:counts[d]}));
    return state.historyDates;
  }
  async function loadDatesForClass(cls){
    const set = {};
    try{
      const rows = await api("GET", "/attendance");
      rows.forEach(r => { if(r.class_name === cls) set[r.date] = true; });
    }catch(e){}
    return Object.keys(set).sort().reverse().map(d => ({date:d, count:1}));
  }
  function computePresent(rec){
    const absentTotal = ABSENCE_KEYS.reduce((s,a) => s + num(rec[cnt(a.key)]), 0);
    const present = num(rec.registered) - num(rec.abroad) - num(rec.individual) - absentTotal;
    return present < 0 ? 0 : present;
  }

  // ---------- rendering shell ----------
  const view = document.getElementById("view");
  const tabsNav = document.getElementById("tabs");
  const userBarHolder = document.getElementById("user-bar-holder");
  function availableTabs(){
    const tabs = [
      {id:"attendance", label:"Відвідування"},
      {id:"report", label:"Звіт відвідування"},
      {id:"monthly", label:"Звіт за місяць"},
      {id:"meals", label:"Заявки на харчування"},
      {id:"history", label:"Історія"}
    ];
    if(isPriv()) tabs.push({id:"settings", label:"Налаштування"});
    return tabs;
  }
  function renderUserBar(){
    if(!state.session){ userBarHolder.innerHTML = ""; return; }
    const classPart = state.session.role === "teacher" ? (state.session.className ? `, ${escapeHtml(state.session.className)}` : ", клас не призначено") : "";
    userBarHolder.innerHTML = `
      <div class="user-bar no-print">
        <div class="who">Ви увійшли як <strong>${escapeHtml(state.session.name)}</strong>${classPart}<span class="role-tag ${roleTagClass(state.session.role)}">${roleLabel(state.session.role)}</span></div>
        <button id="logout-btn">Вийти</button>
      </div>`;
    document.getElementById("logout-btn").addEventListener("click", async () => {
      await clearSession();
      renderTabsNav();
      render();
    });
  }
  function renderTabsNav(){
    if(!state.session){ tabsNav.innerHTML = ""; return; }
    const tabs = availableTabs();
    if(!tabs.find(t => t.id === state.tab)) state.tab = "attendance";
    tabsNav.innerHTML = tabs.map(t => `<button data-tab="${t.id}" class="${t.id===state.tab?'active':''}">${t.label}</button>`).join("");
    tabsNav.querySelectorAll("button[data-tab]").forEach(b => {
      b.addEventListener("click", () => { state.tab = b.dataset.tab; renderTabsNav(); render(); });
    });
  }
  async function loadShared(){
    const jobs = [loadClasses()];
    if(isPriv()) jobs.push(loadUsers(), loadSettings());
    await Promise.all(jobs);
  }
  async function boot(){
    await loadSession();
    if(state.session) await loadShared();
    renderUserBar();
    renderTabsNav();
    render();
  }
  async function finishLogin(u){
    state.session = u;
    await loadShared();
    renderTabsNav();
    render();
  }
  async function render(){
    renderUserBar();
    if(!state.session){ return renderLogin(); }
    if(state.tab === "attendance") return renderAttendance();
    if(state.tab === "report") return renderReport();
    if(state.tab === "monthly") return renderMonthly();
    if(state.tab === "meals") return renderMeals();
    if(state.tab === "history") return renderHistory();
    if(state.tab === "settings" && isPriv()) return renderSettings();
    state.tab = "attendance";
    return renderAttendance();
  }

  // ----- Login -----
  function renderLogin(){
    tabsNav.innerHTML = "";
    const mode = state.loginMode === "sms" ? "sms" : "name";
    view.innerHTML = `
      <div class="login-wrap">
        <div class="card">
          <h2>Вхід</h2>
          <nav class="tabs no-print" style="margin-bottom:16px;">
            <button data-lm="name" class="${mode==='name'?'active':''}">За прізвищем</button>
            <button data-lm="sms" class="${mode==='sms'?'active':''}">За SMS-кодом</button>
          </nav>
          <div class="field"><label>Номер телефону</label><input type="tel" id="login-phone" placeholder="+380 XX XXX XX XX"></div>
          ${mode==='name' ? `
            <div class="field" style="margin-top:12px;"><label>Прізвище та ім'я</label><input type="text" id="login-name" placeholder="напр. Іваненко Олена"></div>
            <button class="btn" id="login-btn" style="margin-top:16px;">Увійти</button>
          ` : `
            <div class="field-row" style="margin-top:12px;">
              <div class="field"><label>Код із SMS</label><input type="text" id="login-code" inputmode="numeric" placeholder="6 цифр"></div>
              <div class="field" style="flex:0; align-self:flex-end;"><button class="btn secondary" id="send-code-btn">Надіслати код</button></div>
            </div>
            <button class="btn" id="verify-code-btn" style="margin-top:8px;">Увійти</button>
          `}
          <div class="status-msg" id="login-status"></div>
        </div>
      </div>`;
    view.querySelectorAll("button[data-lm]").forEach(b => b.addEventListener("click", () => {
      state.loginMode = b.dataset.lm; renderLogin();
    }));
    const phoneVal = () => document.getElementById("login-phone").value;
    if(mode === "name"){
      document.getElementById("login-btn").addEventListener("click", async () => {
        const phone = phoneVal(), name = document.getElementById("login-name").value;
        if(!normPhone(phone) || !name.trim()){ setStatus("login-status", "Введіть телефон і прізвище та ім'я", true); return; }
        try{ await finishLogin(await api("POST", "/login", {phone, name})); }
        catch(e){ setStatus("login-status", e.message, true); }
      });
    } else {

  async function renderAttendanceForm(){
    const holder = document.getElementById("att-form-holder");
    holder.innerHTML = `<div class="empty">Завантаження…</div>`;
    const records = await loadDateRecords(state.date);
    const rec = records[state.selectedClass] || defaultRecord();
    holder.innerHTML = `
      <div class="field-row">
        <div class="field narrow"><label>За реєстром</label><input type="number" min="0" id="f-registered" value="${rec.registered ?? ""}"></div>
        <div class="field narrow"><label>За кордоном</label><input type="number" min="0" id="f-abroad" value="${rec.abroad ?? ""}"></div>
        <div class="field narrow"><label>Індивідуальне навчання</label><input type="number" min="0" id="f-individual" value="${rec.individual ?? ""}"></div>
        <div class="field narrow"><label>Присутні (фактично)</label><div class="computed" id="f-present-computed">${computePresent(rec)}<small>рахується автоматично</small></div></div>
      </div>
      <div class="absence-grid">
        ${ABSENCE_KEYS.map(a => `
          <div class="absence-box">
            <div class="absence-title">${a.label}</div>
            <div class="field-row" style="margin-bottom:8px;">
              <div class="field narrow" style="flex:0 0 90px;"><label>Кількість</label><input type="number" min="0" class="absence-count" data-key="${a.key}" id="f-${a.key}-count" value="${rec[cnt(a.key)] ?? ""}"></div>
              <div class="field"><label>Прізвища учнів</label><input type="text" id="f-${a.key}-names" value="${escapeHtml(rec[nms(a.key)] || "")}" placeholder="Прізвище Ім'я, ..."></div>
            </div>
          </div>`).join("")}
      </div>
      <button class="btn" id="save-att-btn">Зберегти дані відвідування</button>
      ${records[state.selectedClass] ? `<button class="btn danger" id="del-att-btn" style="margin-left:8px;">Видалити запис за цей день</button>` : ""}
      <div class="status-msg" id="att-status"></div>`;
    holder.querySelectorAll(".absence-count, #f-registered, #f-abroad, #f-individual").forEach(inp => inp.addEventListener("input", recomputePresentLive));
    document.getElementById("save-att-btn").addEventListener("click", async () => {
      const newRec = readFormRecord(rec);
      setStatus("att-status", "Збереження…", false);
      let res;
      try{ res = await setAttendance(state.date, state.selectedClass, newRec); }
      catch(e){ setStatus("att-status", "Не вдалося зберегти: " + e.message, true); return; }
      invalidateDateCache(state.date);
      const tg = res.telegram || {};
      setStatus("att-status", tg.ok ? "Збережено, повідомлення надіслано в Telegram" : "Збережено (Telegram: " + (tg.error || "—") + ")", false);
      await renderAttendanceForm();
      if(document.getElementById("att-summary-holder")) await renderAttendanceSummary();
    });
    const delBtn = document.getElementById("del-att-btn");
    if(delBtn){
      delBtn.addEventListener("click", async () => {
        if(!confirm(`Видалити дані відвідування для класу «${state.selectedClass}» за ${fmtDate(state.date)}?`)) return;
        try{ await deleteAttendance(state.date, state.selectedClass); }
        catch(e){ setStatus("att-status", e.message, true); return; }
        invalidateDateCache(state.date);
        await renderAttendanceForm();
        if(document.getElementById("att-summary-holder")) await renderAttendanceSummary();
      });
    }
  }
  function defaultRecord(){
    const r = {registered:"", abroad:"", individual:"", breakfast:null, lunch:null, signature:""};
    ABSENCE_KEYS.forEach(a => { r[cnt(a.key)] = ""; r[nms(a.key)] = ""; });
    return r;
  }
  function readFormRecord(prev){
    const rec = {
      registered: valNum("f-registered"), abroad: valNum("f-abroad"), individual: valNum("f-individual"),
      breakfast: prev.breakfast, lunch: prev.lunch, signature: prev.signature || ""
    };
    ABSENCE_KEYS.forEach(a => {
      rec[cnt(a.key)] = valNum("f-"+a.key+"-count");
      rec[nms(a.key)] = document.getElementById("f-"+a.key+"-names").value.trim();
    });
    rec.present = computePresent(rec);
    return rec;
  }
  function valNum(id){ const el = document.getElementById(id); return el.value === "" ? "" : el.value; }
  function recomputePresentLive(){
    const rec = {registered: valNum("f-registered"), abroad: valNum("f-abroad"), individual: valNum("f-individual")};
    ABSENCE_KEYS.forEach(a => rec[cnt(a.key)] = valNum("f-"+a.key+"-count"));
    document.getElementById("f-present-computed").innerHTML = computePresent(rec) + "<small>рахується автоматично</small>";
  }
  async function renderAttendanceSummary(){
    const label = document.getElementById("summary-date-label");
    if(label) label.textContent = fmtDate(state.date);
    const holder = document.getElementById("att-summary-holder");
    if(!holder) return;
    const records = await loadDateRecords(state.date);
    const clsList = Object.keys(records);
    if(!clsList.length){ holder.innerHTML = `<div class="empty">Ще немає внесених даних за цю дату.</div>`; return; }
    clsList.sort();
    holder.innerHTML = `
      <table class="data">
        <thead><tr><th>Клас</th><th>За реєстром</th><th>За кордоном</th><th>Індив. навч.</th><th>Присутні</th><th>Відсутні</th>
          ${ABSENCE_KEYS.map(a=>`<th>${a.label}</th>`).join("")}</tr></thead>
        <tbody>
        ${clsList.map(c => {
          const r = records[c];
          const absentTotal = ABSENCE_KEYS.reduce((s,a)=>s+num(r[cnt(a.key)]),0);
          return `<tr><td>${escapeHtml(c)}</td><td class="num">${num(r.registered)}</td><td class="num">${num(r.abroad)}</td><td class="num">${num(r.individual)}</td>
            <td class="num"><strong>${computePresent(r)}</strong></td><td class="num">${absentTotal}</td>
            ${ABSENCE_KEYS.map(a=>`<td class="num">${num(r[cnt(a.key)])||"—"}</td>`).join("")}</tr>`;
        }).join("")}
        </tbody>
      </table>`;
  }

  // ----- Report tab (attendance report, with absentee names) -----
  function absenteeBlockHtml(cls, rec){
    const present = computePresent(rec);
    const absentTotal = ABSENCE_KEYS.reduce((s,a)=>s+num(rec[cnt(a.key)]),0);
    let inner = `<h4>${escapeHtml(cls)} — присутні ${present}, відсутні ${absentTotal}</h4>`;
    let any = false;
    ABSENCE_KEYS.forEach(a => {
      const c = num(rec[cnt(a.key)]);
      if(c > 0){
        any = true;
        const names = (rec[nms(a.key)]||"").trim();
        inner += `<div class="absentee-line"><b>${a.label} (${c}):</b> ${names ? escapeHtml(names) : "<i>прізвища не вказано</i>"}</div>`;
      }
    });
    if(!any) inner += `<div class="absentee-line">Відсутніх немає.</div>`;
    return `<div class="report-block">${inner}</div>`;
  }
  async function renderReport(){
    const priv = isPriv();
    if(!priv && !state.session.className){
      view.innerHTML = `<div class="card"><div class="empty">Вашому акаунту ще не призначено клас.</div></div>`;

    view.innerHTML = `

        <h2>Звіт про відвідування</h2>
        <p class="hint">${priv ? "Зведений звіт по всій школі за обрану дату, з прізвищами відсутніх учнів." : "Звіт по вашому класу за обрану дату, з прізвищами відсутніх учнів."}</p>
        <div class="field-row"><div class="field narrow"><label for="rep-date">Дата</label><input type="date" id="rep-date" value="${state.date}"></div></div>

  async function renderReportBody(){
    const holder = document.getElementById("report-holder");
    if(!holder) return;
    holder.innerHTML = `<div class="empty">Завантаження…</div>`;
    const records = await loadDateRecords(state.date);
    const priv = isPriv();
    if(!priv){
      const cls = state.session.className;
      const rec = records[cls];
      if(!rec){ holder.innerHTML = `<div class="empty">Дані відвідування за ${fmtDate(state.date)} для класу «${escapeHtml(cls)}» ще не внесено.</div>`; return; }
      holder.innerHTML = absenteeBlockHtml(cls, rec);
      return;
    }
    const clsList = state.classes.slice().sort();
    if(!clsList.length){ holder.innerHTML = `<div class="empty">Ще немає жодного класу.</div>`; return; }
    let totals = {registered:0, present:0, absent:0};
    ABSENCE_KEYS.forEach(a => totals[a.key] = 0);
    let tableRows = "";
    let blocks = "";
    clsList.forEach(cls => {
      const rec = records[cls];
      if(!rec){
        tableRows += `<tr><td>${escapeHtml(cls)}</td><td class="num">—</td><td class="num">—</td><td class="num">—</td>${ABSENCE_KEYS.map(()=>`<td class="num">—</td>`).join("")}</tr>`;
        return;
      }
      const present = computePresent(rec);
      const absentTotal = ABSENCE_KEYS.reduce((s,a)=>s+num(rec[cnt(a.key)]),0);
      totals.registered += num(rec.registered);
      totals.present += present;
      totals.absent += absentTotal;
      ABSENCE_KEYS.forEach(a => totals[a.key] += num(rec[cnt(a.key)]));
      tableRows += `<tr><td>${escapeHtml(cls)}</td><td class="num">${num(rec.registered)}</td><td class="num"><strong>${present}</strong></td><td class="num">${absentTotal}</td>
        ${ABSENCE_KEYS.map(a=>`<td class="num">${num(rec[cnt(a.key)])||"—"}</td>`).join("")}</tr>`;
      blocks += absenteeBlockHtml(cls, rec);
    });
    tableRows += `<tr class="totals-row"><td>Разом</td><td class="num">${totals.registered}</td><td class="num">${totals.present}</td><td class="num">${totals.absent}</td>
      ${ABSENCE_KEYS.map(a=>`<td class="num">${totals[a.key]||"—"}</td>`).join("")}</tr>`;
    holder.innerHTML = `
      <table class="data" style="margin-bottom:18px;">
        <thead><tr><th>Клас</th><th>За реєстром</th><th>Присутні</th><th>Відсутні</th>${ABSENCE_KEYS.map(a=>`<th>${a.label}</th>`).join("")}</tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
      <h3>Відсутні учні за класами</h3>
      ${blocks || `<div class="empty">Немає внесених даних за цю дату.</div>`}`;
  }

  // ----- Monthly report tab (per-student days & reasons, aggregated over a month) -----
  async function loadMonthRecords(monthPrefix, clsFilter){
    let rows = [];
    try{ rows = await api("GET", "/attendance?month=" + monthPrefix); }catch(e){}
    return rows
      .filter(r => !clsFilter || r.class_name === clsFilter)
      .map(r => ({date: r.date, cls: r.class_name, rec: r}));
  }
  const REASON_CODE = {illness:"хв", grvi:"хв", family:"Н", no_reason:"Б"};
  function normNameKey(name){ return String(name||"").trim().toLowerCase().replace(/\s+/g," "); }
  function toDisplayName(name){
    return String(name||"").trim().replace(/\s+/g," ").split(" ")
      .map(w => w ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : w).join(" ");
  }
  function fmtDateShort(iso){ const [,m,d] = iso.split("-"); return `${d}.${m}`; }
  function buildMonthlyAbsenceMap(entries){
    // returns { className: { normalizedNameKey: {display, entries:[{date, code}]} } }
    const byClass = {};
    entries.forEach(({date, cls, rec}) => {
      ABSENCE_KEYS.forEach(a => {
        const namesRaw = (rec[nms(a.key)]||"").trim();
        if(!namesRaw) return;
        const names = namesRaw.split(/[,;\n]+/).map(s => s.trim()).filter(Boolean);
        if(!names.length) return;
        if(!byClass[cls]) byClass[cls] = {};
        names.forEach(rawName => {
          const key = normNameKey(rawName);
          if(!key) return;
          if(!byClass[cls][key]) byClass[cls][key] = {display: toDisplayName(rawName), entries: []};
          byClass[cls][key].entries.push({date, code: REASON_CODE[a.key] || "?"});
        });
      });
    });
    return byClass;
  }
  function classMonthlyTableHtml(cls, studentsMap){
    const dateSet = new Set();
    Object.values(studentsMap).forEach(s => s.entries.forEach(e => dateSet.add(e.date)));
    const dates = Array.from(dateSet).sort();
    const rows = Object.values(studentsMap).sort((a,b) => a.display.localeCompare(b.display, "uk"));
    const thead = `<tr><th>Прізвище</th>${dates.map(d=>`<th>${fmtDateShort(d)}</th>`).join("")}<th>Всього</th></tr>`;
    const tbody = rows.map(s => {
      const byDate = {};
      s.entries.forEach(e => { byDate[e.date] = e.code; });
      const total = Object.keys(byDate).length;
      return `<tr><td>${escapeHtml(s.display)}</td>${dates.map(d=>`<td class="num">${byDate[d]||""}</td>`).join("")}<td class="num"><strong>${total}</strong></td></tr>`;
    }).join("");
    return `<h3>${escapeHtml(cls)}</h3><table class="data" style="margin-bottom:22px;"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
  }
  function absenceLegendHtml(){
    return `<div class="notice">
      <div><b>Б</b> — без поважної причини</div>
      <div><b>Н</b> — за сімейними обставинами</div>
      <div><b>хв</b> — по хворобі або ГРВІ</div>
    </div>`;
  }
  async function renderMonthly(){
    const priv = isPriv();
    if(!priv && !state.session.className){
      view.innerHTML = `<div class="card"><div class="empty">Вашому акаунту ще не призначено клас.</div></div>`;
      return;
    }
    view.innerHTML = `
      <div class="card">
        <h2>Звіт за місяць</h2>
        <p class="hint">${priv ? "Таблиця відвідування по всіх класах за обраний місяць: рядок — учень, стовпець — дата, у клітинці — причина відсутності." : "Таблиця відвідування вашого класу за обраний місяць: рядок — учень, стовпець — дата, у клітинці — причина відсутності."} Прізвища, написані з великої чи малої літери, вважаються однією і тією ж дитиною.</p>
        <div class="field-row"><div class="field narrow"><label for="rep-month">Місяць</label><input type="month" id="rep-month" value="${state.reportMonth}"></div></div>
        <div id="monthly-holder"><div class="empty">Завантаження…</div></div>
      </div>`;
    document.getElementById("rep-month").addEventListener("change", e => { state.reportMonth = e.target.value || monthPrefixDefault(); renderMonthlyBody(); });
    await renderMonthlyBody();
  }
  async function renderMonthlyBody(){
    const holder = document.getElementById("monthly-holder");
    if(!holder) return;
    holder.innerHTML = `<div class="empty">Завантаження…</div>`;
    const priv = isPriv();
    const clsFilter = priv ? null : state.session.className;
    const entries = await loadMonthRecords(state.reportMonth, clsFilter);
    if(!entries.length){ holder.innerHTML = `<div class="empty">Немає внесених даних відвідування за цей місяць.</div>`; return; }
    const byClass = buildMonthlyAbsenceMap(entries);
    const clsList = Object.keys(byClass).sort();
    if(!clsList.length){ holder.innerHTML = `<div class="empty">За цей місяць відсутніх (з указаними прізвищами) не зафіксовано.</div>`; return; }
    holder.innerHTML = absenceLegendHtml() + clsList.map(cls => classMonthlyTableHtml(cls, byClass[cls])).join("");
  }

  // ----- Meals tab -----
  async function renderMeals(){
    const priv = isPriv();
    if(!priv && !state.session.className){
      view.innerHTML = `<div class="card"><div class="empty">Вашому акаунту ще не призначено клас.</div></div>`;
      return;
    }
    view.innerHTML = `
      <div class="card no-print">
        <h2>Заявки на харчування</h2>
        <p class="hint">Порції за замовчуванням дорівнюють кількості присутніх учнів — за потреби скоригуйте вручну перед друком. Учні 1–4, 5, 6 та 9 класів отримують лише сніданок, учні 7 та 8 класів — лише обід; це враховано автоматично.</p>
        <div class="field-row"><div class="field narrow"><label for="meal-date">Дата</label><input type="date" id="meal-date" value="${state.date}"></div></div>
      </div>
      <div class="card">
        <div class="slip-toolbar no-print">
          <div id="meal-count-label" class="hint" style="margin:0;"></div>
          <div>
            <button class="btn secondary" id="send-summary-btn">Надіслати зведення в Telegram</button>
            <button class="btn" id="print-btn" style="margin-left:8px;">Друкувати заявки</button>
          </div>
        </div>
        <div class="status-msg no-print" id="meal-status"></div>
        <div class="print-title" id="print-title"></div>
        <div id="print-area"><div class="empty">Завантаження…</div></div>
      </div>`;
    document.getElementById("meal-date").addEventListener("change", e => { state.date = e.target.value || todayStr(); renderMeals(); });
    document.getElementById("print-btn").addEventListener("click", () => window.print());
    document.getElementById("send-summary-btn").addEventListener("click", async () => {
      setStatus("meal-status", "Надсилання…", false);
      try{ await sendSummary(state.date); setStatus("meal-status", "Зведення надіслано в Telegram", false); }
      catch(e){ setStatus("meal-status", "Помилка: " + e.message, true); }
    });
    await renderMealSlips();
  }
  async function renderMealSlips(){
    const priv = isPriv();
    const records = await loadDateRecords(state.date);
    let clsList = Object.keys(records).sort();
    if(!priv) clsList = clsList.filter(c => c === state.session.className);
    document.getElementById("print-title").textContent = `Заявки на харчування — ${fmtDate(state.date)}`;
    document.getElementById("meal-count-label").textContent = clsList.length ? `Класів з даними на цю дату: ${clsList.length}` : "Немає даних відвідування на цю дату";
    const area = document.getElementById("print-area");
    if(!clsList.length){ area.innerHTML = `<div class="empty">Спочатку внесіть дані відвідування для потрібної дати на вкладці «Відвідування».</div>`; return; }
    area.innerHTML = `<div class="slip-grid">${clsList.map(c => slipHtml(c, records[c])).join("")}</div>`;
    clsList.forEach(c => {
      const safeId = cssSafe(c);
      const brInput = document.getElementById("br-"+safeId), luInput = document.getElementById("lu-"+safeId), sigInput = document.getElementById("sig-"+safeId);
      [brInput, luInput, sigInput].forEach(inp => {
        inp.addEventListener("change", async () => {
          const rec = records[c];
          rec.breakfast = brInput.value; rec.lunch = luInput.value; rec.signature = sigInput.value;
          await setAttendance(state.date, c, rec);
          invalidateDateCache(state.date);
        });
      });
    });
  }
  function slipHtml(cls, rec){
    const present = computePresent(rec);
    const defaults = mealDefaults(cls, present);
    const breakfast = (rec.breakfast === null || rec.breakfast === undefined || rec.breakfast === "") ? defaults.breakfast : rec.breakfast;
    const lunch = (rec.lunch === null || rec.lunch === undefined || rec.lunch === "") ? defaults.lunch : rec.lunch;
    const safeId = cssSafe(cls);
    const note = mealRuleNote(cls);
    return `
      <div class="slip">
        <h3>Заявка на харчування</h3>
        <div class="row"><label>Дата</label><strong>${fmtDate(state.date)}</strong></div>
        <div class="row"><label>Клас</label><strong>${escapeHtml(cls)}</strong></div>
        <div class="row"><label>Сніданок</label><input type="number" min="0" id="br-${safeId}" value="${breakfast}"> порцій</div>
        <div class="row"><label>Обід</label><input type="number" min="0" id="lu-${safeId}" value="${lunch}"> порцій</div>
        <div class="row"><label>Підпис</label><input type="text" id="sig-${safeId}" value="${escapeHtml(rec.signature || "")}" placeholder="ПІБ"></div>
        ${note ? `<div class="rule-note">${note}</div>` : ""}
      </div>`;
  }

  // ----- History tab -----
  async function renderHistory(){
    const priv = isPriv();
    if(!priv && !state.session.className){
      view.innerHTML = `<div class="card"><div class="empty">Вашому акаунту ще не призначено клас.</div></div>`;
      return;
    }
    view.innerHTML = `
      <div class="card">
        <h2>Історія за датами</h2>
        <p class="hint">Оберіть дату, щоб переглянути звіт відвідування або перейти до заявок.</p>
        <div class="history-list" id="history-holder"><div class="empty">Завантаження…</div></div>
      </div>
      <div class="card" id="history-detail-card" style="display:none;">
        <h2 id="history-detail-title"></h2>
        <div id="history-detail-holder"></div>
        <div style="margin-top:14px;"><button class="btn secondary" id="goto-meals-btn">Перейти до заявок на харчування за цю дату</button></div>
      </div>`;
    const dates = priv ? await loadAllDates() : await loadDatesForClass(state.session.className);
    const holder = document.getElementById("history-holder");
    if(!dates.length){ holder.innerHTML = `<div class="empty">Історія поки порожня.</div>`; return; }
    holder.innerHTML = dates.map(d => `<div class="history-item" data-date="${d.date}"><span>${fmtDate(d.date)}</span>${priv ? `<span class="cnt">${d.count} клас(ів)</span>` : ""}</div>`).join("");
    holder.querySelectorAll(".history-item").forEach(el => el.addEventListener("click", () => showHistoryDetail(el.dataset.date)));
  }
  async function showHistoryDetail(date){
    const priv = isPriv();
    const card = document.getElementById("history-detail-card");
    card.style.display = "block";
    document.getElementById("history-detail-title").textContent = "Відвідування — " + fmtDate(date);
    const holder = document.getElementById("history-detail-holder");
    holder.innerHTML = `<div class="empty">Завантаження…</div>`;
    const records = {};
    try{
      const rows = await api("GET", "/attendance?date=" + date);
      rows.forEach(r => { records[r.class_name] = r; });
    }catch(e){}
    let clsList = Object.keys(records).sort();
    if(!priv) clsList = clsList.filter(c => c === state.session.className);
    if(!clsList.length){ holder.innerHTML = `<div class="empty">Немає даних.</div>`; }
    else{
      holder.innerHTML = clsList.map(c => absenteeBlockHtml(c, records[c])).join("");
    }
    document.getElementById("goto-meals-btn").onclick = () => { state.date = date; state.tab = "meals"; renderTabsNav(); render(); };
  }

  boot();
})();
</script>
</body>
